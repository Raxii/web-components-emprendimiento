<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StepUp Sneakers</title>
  <link rel="stylesheet" href="./estilos.css">
  <script type="module" src="./componentes/tarjeta-producto.js"></script>
</head>
<body>
  <header class="encabezado">
    <h1>StepUp Sneakers</h1>
    <p>Calzado urbano para estudiantes y jóvenes que buscan comodidad y estilo.</p>
  </header>

  <main class="catalogo">
    <!-- TARJETA BYRON -->
    <div data-aporte="byron"></div>
    <!-- FIN TARJETA BYRON -->

    <!-- TARJETA MATEO -->
    <tarjeta-producto precio="84.50">
      <img slot="foto" src="./img/zapatoM.png" alt="Zapatilla Street Runner">
      <h3 slot="nombre">Street Runner</h3>
      <p>Zapatilla urbana cómoda, elegante, resistente y pensada para uso diario.</p>
    </tarjeta-producto>
    <!-- FIN TARJETA MATEO -->

    <!-- TARJETA ESTEFI -->
    <div data-aporte="estefi"></div>
    <!-- FIN TARJETA ESTEFI -->

    <!-- TARJETA CARLOS -->
    <div data-aporte="carlos"></div>
    <!-- FIN TARJETA CARLOS -->
  </main>
</body>
</html>
