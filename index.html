<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FunkoManía - Vecna</title>
  <link rel="stylesheet" href="./estilos.css">
</head>

<body>

  <header>
    <h1>FunkoManía</h1>
    <p>Encuentra tus personajes favoritos y agrégalos a tu colección.</p>
  </header>

  <main class="catalogo">

    <!-- TARJETA MATEO -->
    <tarjeta-mateo class="tarjeta-3" precio="25">

      <img slot="foto" src="./img/StrangerThings.png" alt="Funko Pop de Vecna">

      <h3 slot="nombre">Vecna</h3>

      <p slot="descripcion">
        ¿Te atreves a llevar el Mundo del Revés
        a tu habitación? Vecna, el aterrador enemigo
        de Stranger Things, llega con su apariencia
        monstruosa. Una figura ideal para los amantes
        del misterio, el suspenso y el terror.
      </p>

    </tarjeta-mateo>

  </main>

  <script type="module" src="./componentes/Targeta_Luis.js"></script>

</body>

</html>
